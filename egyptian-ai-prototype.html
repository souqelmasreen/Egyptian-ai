<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egyptian AI | المساعد الذكي المصري</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f3f4f6;font-family:system-ui,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:18px}.app{width:min(720px,100%);background:#1a2030;border:1px solid #30394e;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #0006}.head{padding:24px;background:linear-gradient(130deg,#155e75,#243b80)}h1{margin:0 0 8px;font-size:27px}.head p{margin:0;color:#e1f2ff}.chat{height:48vh;min-height:280px;max-height:500px;overflow:auto;padding:18px}.msg{white-space:pre-wrap;line-height:1.7;padding:12px 15px;border-radius:14px;margin:10px 0;max-width:90%}.bot{background:#293247}.user{background:#135e76;margin-right:auto}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid #30394e}textarea{flex:1;resize:none;min-height:48px;max-height:140px;border-radius:12px;border:1px solid #414b62;background:#111724;color:white;padding:12px;font:inherit}button{border:0;border-radius:12px;background:#16a6b7;color:white;font-weight:bold;padding:0 18px;font-size:16px}footer{text-align:center;color:#9ba7bb;font-size:12px;padding:0 10px 15px}
</style></head><body><main class="app"><header class="head"><h1>🇪🇬 Egyptian AI</h1><p>المساعد الذكي المصري — تجربة أولية</p></header><section class="chat" id="chat"><div class="msg bot">أهلاً بيك! أنا Egyptian AI 🤖
اكتبلي رسالتك ونبدأ.</div></section><form class="composer" id="form"><textarea id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea><button id="send" type="submit">إرسال</button></form><footer>نسخة تجريبية للواجهة — الربط بالذكاء الاصطناعي سيتم إضافته لاحقًا</footer></main><script>
const form=document.getElementById('form'), input=document.getElementById('input'), chat=document.getElementById('chat');
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
form.addEventListener('submit',e=>{e.preventDefault();const val=input.value.trim();if(!val)return;add(val,'user');input.value='';add('وصلت رسالتك بنجاح ✅\nدي نسخة واجهة تجريبية، ولسه محتاجين نربطها بمحرك الذكاء الاصطناعي عشان أقدر أرد عليك فعليًا.','bot');input.focus();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script></body></html>
